<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Snake Game V2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="neon-text">SNAKE <span class="v2-badge">V2</span></h1>
            <div class="score-board" id="scoreBoard" title="Click to Pause/Resume">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="score-box">High Score: <span id="highScore">0</span></div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="pauseScreen" class="overlay hidden">
                <h2>PAUSED</h2>
                <p>Press Space to Resume</p>
            </div>

            <div id="gameOverScreen" class="overlay hidden">
                <h2>GAME OVER</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button id="restartBtn">Play Again</button>
            </div>
        </div>

        <div class="controls">
            <button class="d-btn" id="up">▲</button>
            <div class="row">
                <button class="d-btn" id="left">◀</button>
                <button class="d-btn" id="down">▼</button>
                <button class="d-btn" id="right">▶</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 ZippyNx</footer>
    
    <script src="script.js"></script>
</body>
</html>
